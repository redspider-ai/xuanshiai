name: Backend message and media core CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: testing
      AUTO_INIT_DB: "false"
      # 不配置数据库服务/凭据；即使测试意外请求会话也不能写真实库。
      DATABASE_URL: mysql+aiomysql://ci:ci@127.0.0.1:1/ci_unreachable
      COMMUNITY_TEST_DATABASE_URL: ""
      AI_TEST_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend and dev dependencies
        run: uv sync --locked --extra dev
      # 全仓 Ruff 存量告警另行收敛；本门禁不跳过这些规则，只限定本阶段改动域。
      - name: Ruff (message and media scope)
        run: uv run --no-sync ruff check app/api/routes/social.py app/api/routes/discovery.py app/schemas/social.py app/services/social.py app/services/media.py app/services/member_follow_up_admin.py scripts/reproduce_upload_exposure.py tests/test_social_features.py tests/test_social_message_idempotency.py tests/test_discovery_features.py tests/test_member_follow_up_media.py tests/test_chat_session_pinned.py tests/test_chat_recall_preview.py tests/test_social_user_avatar_thumb.py
      # 2026-10-26「优先解决」三项需求改动域：可见性口径统一、同意后会话与系统问候、爆灯统计排除自置顶。
      # 这些文件此前不在任何 Ruff 列表内，新增/改动后必须纳入，否则 F821 之类的运行期错误逃过 CI。
      # 2026-10-29 追加：卡片 is_liked/公开字段、首页卡片预览、额度上限单一来源（quotas 抽出
      # resolve_apply_limit / resolve_superlike_limit / resolve_paper_plane_limit）。
      - name: Ruff (discovery, profile and superlike scope)
        run: uv run --no-sync ruff check app/services/discovery.py app/services/profile.py app/services/quotas.py app/services/community.py app/schemas/discovery.py app/schemas/emotion_lab.py app/services/emotion_lab.py app/api/routes/emotion_lab.py app/services/member_behavior_admin.py app/services/member_crm_filter.py app/api/routes/member_follow_up_admin.py tests/test_apply_chat_greeting_and_superlike_scope.py tests/test_discovery_is_liked.py tests/test_discovery_card_public_fields.py tests/test_discovery_card_preview.py tests/test_quota_limit_single_source.py tests/test_vip_authorization_consistency.py tests/test_paper_plane_chances.py tests/test_emotion_lab_profile_source.py tests/test_community_quotas_points_available.py
      - name: Message and media unit contracts (no integration/live/manual)
        env:
          UPLOAD_DIR: ${{ runner.temp }}/xuanshiai-uploads
        run: uv run --no-sync pytest tests/test_social_features.py tests/test_social_message_idempotency.py tests/test_discovery_features.py tests/test_member_follow_up_media.py tests/test_apply_chat_greeting_and_superlike_scope.py tests/test_discovery_is_liked.py tests/test_discovery_card_public_fields.py tests/test_discovery_card_preview.py tests/test_quota_limit_single_source.py tests/test_vip_authorization_consistency.py tests/test_paper_plane_chances.py tests/test_emotion_lab_profile_source.py tests/test_chat_session_pinned.py tests/test_chat_recall_preview.py tests/test_social_user_avatar_thumb.py tests/test_community_quotas_points_available.py -q

  ai-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: testing
      AUTO_INIT_DB: "false"
      DATABASE_URL: mysql+aiomysql://ci:ci@127.0.0.1:1/ci_unreachable
      REDIS_URL: redis://127.0.0.1:1/5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend and dev dependencies
        run: uv sync --locked --extra dev
      - name: Ruff (AI and voice scope)
        run: >-
          uv run --no-sync ruff check
          app/api/routes/ai_advisor.py app/api/routes/ai_compatibility.py app/api/routes/voice.py
          app/api/routes/voice_moxiang.py app/api/routes/voice_ws.py
          app/core/config.py app/core/security.py app/main.py
          app/schemas/ai_advisor.py
          app/services/ai/providers.py app/services/ai_advisor.py app/services/voice/auth.py
          app/services/voice/audio_access.py app/services/voice/gateway.py
          app/services/voice/providers.py app/services/voice/realtime/context.py
          app/services/voice/realtime/moxiang_bridge.py
          tests/test_ai_advisor.py tests/test_ai_advisor_output_locale.py
          tests/test_ai_api_contracts.py tests/test_ai_config_hardening.py
          tests/test_ai_schema_and_provider.py tests/test_ai_voice_audio_access.py
          tests/test_voice_auth.py tests/test_voice_cleanup.py
          tests/test_voice_providers_aliyun.py tests/test_voice_ws.py
      - name: AI and voice unit contracts
        env:
          UPLOAD_DIR: ${{ runner.temp }}/xuanshiai-ai-uploads
        run: >-
          uv run --no-sync pytest
          tests/test_ai_advisor.py
          tests/test_ai_advisor_output_locale.py
          tests/test_ai_schema_and_provider.py
          tests/test_ai_api_contracts.py
          tests/test_ai_config_hardening.py
          tests/test_ai_voice_audio_access.py
          tests/test_voice_auth.py
          tests/test_voice_ws.py
          tests/test_voice_providers_aliyun.py
          tests/test_voice_cleanup.py -q

  # 审计整改（脱敏 / 数据范围 / 事务 / 报名软删除）：全部为不依赖 DB 的单元契约。
  # 2026-10-14 补齐 PR #49 新增的 7 个测试文件（此前未挂任何 job，CI 里从不执行，
  # 导致「新增回归测试」实际没有门禁）；同批补齐了配套的 Ruff 文件列表。
  admin-scope-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: testing
      AUTO_INIT_DB: "false"
      DATABASE_URL: mysql+aiomysql://ci:ci@127.0.0.1:1/ci_unreachable
      REDIS_URL: redis://127.0.0.1:1/5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend and dev dependencies
        run: uv sync --locked --extra dev
      - name: Ruff (admin scope, redaction and signup soft delete scope)
        run: >-
          uv run --no-sync ruff check
          app/api/routes/activity_admin.py app/api/routes/customer_leads_admin.py
          app/api/routes/matchmaker_crm_admin.py app/api/routes/matchmaker_member_admin.py
          app/core/sensitive_fields.py app/services/community.py
          app/services/region/__init__.py app/services/region/types.py
          app/services/region/ip_offline.py app/services/region/phone_offline.py
          app/services/region/registry.py app/services/region/refresh.py
          app/services/customer_lead_admin.py app/services/finance.py
          app/services/idempotency.py app/services/matchmaker_member_admin.py
          app/services/message_admin.py
          tests/test_activity_signup_soft_delete.py tests/test_admin_data_scope_d4.py
          tests/test_certification_material_scope.py tests/test_crm_reassign_org_ownership.py
          tests/test_finance_commission_anchor.py tests/test_matchmaker_crm_data_scope.py
          tests/test_member_admin_scope_params.py tests/test_message_admin_redaction.py
          tests/test_sensitive_operations.py tests/test_wechat_field_redaction.py
          tests/test_admin_data_scope_d16.py tests/test_admin_date_query_contract.py
          tests/test_legacy_matchmaker_scope_d10.py tests/test_payment_callback_verification.py
          tests/test_permission_code_seed_coverage.py tests/test_realname_face_unification.py
          tests/test_refund_membership_revoke.py
      - name: Admin scope, redaction and soft delete contracts
        env:
          UPLOAD_DIR: ${{ runner.temp }}/xuanshiai-admin-uploads
        run: >-
          uv run --no-sync pytest
          tests/test_message_admin_redaction.py
          tests/test_wechat_field_redaction.py
          tests/test_sensitive_operations.py
          tests/test_member_admin_scope_params.py
          tests/test_admin_data_scope_d4.py
          tests/test_certification_material_scope.py
          tests/test_crm_reassign_org_ownership.py
          tests/test_finance_commission_anchor.py
          tests/test_activity_signup_soft_delete.py
          tests/test_matchmaker_crm_data_scope.py
          tests/test_admin_data_scope_d16.py
          tests/test_admin_date_query_contract.py
          tests/test_legacy_matchmaker_scope_d10.py
          tests/test_payment_callback_verification.py
          tests/test_permission_code_seed_coverage.py
          tests/test_realname_face_unification.py
          tests/test_refund_membership_revoke.py
          tests/test_region_refresh_20261101.py -q

  # 画像会话契约（master 活动槽抢占与复用、会话状态终态守卫、journey/start 响应
  # 字段）：全部为不依赖 DB 的内存假库单元契约。test_master_session.py 与
  # test_ai_profile_sessions.py 此前未被任何 job 执行，属既有缺口，一并补上。
  ai-profile-session-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: testing
      AUTO_INIT_DB: "false"
      DATABASE_URL: mysql+aiomysql://ci:ci@127.0.0.1:1/ci_unreachable
      REDIS_URL: redis://127.0.0.1:1/5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend and dev dependencies
        run: uv sync --locked --extra dev
      - name: Ruff (profile session and moxiang journey scope)
        run: >-
          uv run --no-sync ruff check
          app/api/routes/ai_moxiang.py app/services/ai/profile.py
          tests/test_ai_profile_sessions.py tests/test_master_session.py
          tests/test_moxiang_journey_start_contract.py
          tests/test_ai_profile_field_metadata.py
      - name: Profile session and moxiang journey contracts
        env:
          UPLOAD_DIR: ${{ runner.temp }}/xuanshiai-ai-session-uploads
        run: >-
          uv run --no-sync pytest
          tests/test_master_session.py
          tests/test_moxiang_journey_start_contract.py
          tests/test_ai_profile_sessions.py
          tests/test_ai_profile_publish.py
          tests/test_ai_profile_entries.py
          tests/test_ai_profile_field_metadata.py -q

  # continuous_v2 新链路门禁：双画像抽取、成稿替换语义、删除后 Memory 一致性与
  # 预览/确认路由契约。全部为不依赖 DB 的单元契约，但此前没有任何 job 执行——
  # 这正是 2026-10-08 验收报告指出的「新业务没进 CI」缺口。
  ai-continuous-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: testing
      AUTO_INIT_DB: "false"
      DATABASE_URL: mysql+aiomysql://ci:ci@127.0.0.1:1/ci_unreachable
      REDIS_URL: redis://127.0.0.1:1/5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend and dev dependencies
        run: uv sync --locked --extra dev
      - name: Ruff (continuous portrait scope)
        run: >-
          uv run --no-sync ruff check
          app/services/ai/candidates.py app/services/ai/continuous.py
          app/services/ai/search.py app/services/ai/compatibility.py app/services/ai/recommend.py
          app/services/ai/features.py
          app/services/ai/continuous_memory.py app/services/ai/journey.py
          app/services/ai/prompts/profile_extract.py
          app/services/voice/realtime/context.py
          app/services/voice/realtime/moxiang_bridge.py
          app/api/routes/voice_moxiang.py
          tests/test_ai_continuous_dual_journey.py
          tests/test_ai_continuous_memory.py
          tests/test_ai_continuous_revision_dependencies.py
          tests/test_ai_continuous_routes.py tests/test_ai_continuous_docs.py
          tests/test_ai_profile_preview.py
          tests/test_ai_moxiang_candidate_pool.py
          tests/test_worker_registration.py
          tests/test_ai_memory_projection_shadow.py tests/test_ai_search_memory_projection.py
      - name: Continuous portrait and preview contracts
        env:
          UPLOAD_DIR: ${{ runner.temp }}/xuanshiai-continuous-uploads
        run: >-
          uv run --no-sync pytest
          tests/test_ai_continuous_dual_journey.py
          tests/test_ai_continuous_memory.py
          tests/test_ai_continuous_revision_dependencies.py
          tests/test_ai_continuous_routes.py
          tests/test_ai_continuous_docs.py
          tests/test_ai_profile_preview.py
          tests/test_ai_moxiang_candidate_pool.py
          tests/test_worker_registration.py
          tests/test_worker_finalize_gate.py tests/test_worker_lease_safety.py
          tests/test_ai_memory_projection_shadow.py tests/test_ai_search_memory_projection.py
          tests/test_ai_feature_projection.py -q

  # 隔离真实库集成：使用本 job 自己创建的 MySQL/Redis service，覆盖 continuous
  # 成稿/确认事务、WS→候选→Worker→预览→确认链路与 Memory/投影。绝不连接开发或
  # 生产库：所有 URL 都指向本 job 的 service 容器。
  ai-continuous-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENVIRONMENT: testing
      AUTO_INIT_DB: "false"
      AI_TEST_DATABASE_URL: mysql+aiomysql://root:@127.0.0.1:3306/xuanshiai_ai_test
      AI_TEST_REDIS_URL: redis://127.0.0.1:6379/5
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: xuanshiai_ai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend and dev dependencies
        run: uv sync --locked --extra dev
      - name: Continuous portrait real-db integration
        env:
          UPLOAD_DIR: ${{ runner.temp }}/xuanshiai-continuous-integration-uploads
        run: >-
          uv run --no-sync pytest
          tests/integration/ai/test_continuous_portrait_real_db.py
          tests/integration/ai/test_moxiang_journey_ws_chain_real_db.py
          tests/integration/ai/test_ai_memory_projection_real_db.py
          tests/integration/ai/test_consent_generation_identity_real_db.py -q
